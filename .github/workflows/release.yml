name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish, including the v prefix (for example v1.0.0).'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, package, and publish the VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must look like v1.0.0. Refusing: ${RELEASE_TAG}"
            exit 1
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install extension-host libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(
            xvfb
            libnss3
            libgbm1
            libdrm2
            libxkbcommon0
            libxcomposite1
            libxdamage1
            libxfixes3
            libxrandr2
            libpango-1.0-0
            libcairo2
            libx11-xcb1
            libxcb-dri3-0
          )
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            packages+=(
              libgtk-3-0t64
              libasound2t64
              libatk1.0-0t64
              libatk-bridge2.0-0t64
              libcups2t64
            )
          else
            packages+=(
              libgtk-3-0
              libasound2
              libatk1.0-0
              libatk-bridge2.0-0
              libcups2
            )
          fi
          sudo apt-get install -y "${packages[@]}"

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches the extension version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/extension/package.json').version")"
          tag="${RELEASE_TAG#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag ${RELEASE_TAG} does not match extension version ${version}."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        id: package
        run: npm run package

      - name: Name the VSIX
        id: vsix
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/extension/package.json').version")"
          file="rezis-codeflow-${version}.vsix"
          mv rezis-codeflow.vsix "$file"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Do not echo OVSX_PAT or VSCE_PAT. GitHub masks secret values; these
      # steps still avoid printing the variables.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: ${{ steps.vsix.outputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::warning title=Open VSX skipped::OVSX_PAT is not set. Skipping Open VSX. The VSIX is still attached to the GitHub Release. See docs/PUBLISHING.md."
            exit 0
          fi
          if ! npx --yes ovsx create-namespace rezis-work --pat "$OVSX_PAT"; then
            echo "::warning title=Open VSX namespace::ovsx create-namespace did not succeed. If the namespace already exists, publish continues."
          fi
          npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT" --skip-duplicate

      - name: Publish to the VS Code Marketplace
        if: ${{ !cancelled() && steps.vsix.outcome == 'success' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.vsix.outputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning title=Marketplace skipped::VSCE_PAT is not set. Skipping the VS Code Marketplace. Upload the VSIX at https://marketplace.visualstudio.com/manage — see docs/PUBLISHING.md."
            exit 0
          fi
          npx --yes @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT" --skip-duplicate

      - name: Publish the GitHub Release
        if: ${{ !cancelled() && steps.vsix.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          VSIX: ${{ steps.vsix.outputs.file }}
        run: |
          set -euo pipefail
          notes="Install \`${VSIX}\` from this release, or from Open VSX and the VS Code Marketplace (extension id \`rezis-work.rezis-codeflow\`) after those publishes succeed. Cursor installs from Open VSX. A missing token skips that registry. See docs/PUBLISHING.md."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$VSIX" --clobber
          else
            gh release create "$RELEASE_TAG" "$VSIX" \
              --title "CodeFlow ${RELEASE_TAG}" \
              --notes "$notes"
          fi
