name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install extension-host libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(
            xvfb
            libnss3
            libgbm1
            libdrm2
            libxkbcommon0
            libxcomposite1
            libxdamage1
            libxfixes3
            libxrandr2
            libpango-1.0-0
            libcairo2
            libx11-xcb1
            libxcb-dri3-0
          )
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            packages+=(
              libgtk-3-0t64
              libasound2t64
              libatk1.0-0t64
              libatk-bridge2.0-0t64
              libcups2t64
            )
          else
            packages+=(
              libgtk-3-0
              libasound2
              libatk1.0-0
              libatk-bridge2.0-0
              libcups2
            )
          fi
          sudo apt-get install -y "${packages[@]}"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: codeflow-vsix
          path: codeflow.vsix
          if-no-files-found: error

  benchmark:
    name: Fixture benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Benchmark the in-repo fixture
        run: npm run bench -- --quick
